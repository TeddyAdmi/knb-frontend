<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>КНБ PKOIN</title>
  <script src="https://bastyon.com/js/pocketnet/sdk.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <h1>Камень, Ножницы, Бумага</h1>
  <div id="user-info">Загрузка аккаунта...</div>

  <div id="rooms-screen">
    <h2>Выберите комнату</h2>
    <div id="rooms-grid"></div>
  </div>

  <div id="game-screen" style="display:none;">
    <h3 id="room-title"></h3>
    <div id="status">Ожидание...</div>
    <div>
      <button onclick="makeMove('rock')">🪨 Камень</button>
      <button onclick="makeMove('paper')">📄 Бумага</button>
      <button onclick="makeMove('scissors')">✂️ Ножницы</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
